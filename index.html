<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicVault - Apple Music Lyrics</title>
  <style>
    :root {
      --bg-1: #1a1625;
      --bg-2: #0b0d14;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, var(--bg-1), var(--bg-2) 85%);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Mini-player YouTube wajib berukuran min 200x113px & terlihat agar tidak diblokir browser/YouTube */
    .yt-mini-box {
      position: fixed;
      right: 20px;
      bottom: 84px;
      width: 220px;
      height: 124px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #000;
      z-index: 20;
    }

    #yt-hidden-player {
      width: 100%;
      height: 100%;
    }

    /* Top Bar */
    .top-bar {
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .track-info-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cover-art {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.08);
      display: none;
    }

    .song-meta h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .song-meta p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 6px;
      margin-left: 6px;
      font-weight: 600;
      vertical-align: middle;
    }
    .badge-local { background: rgba(52, 211, 153, 0.2); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-lrclib { background: rgba(251, 191, 36, 0.15); color: #fcd34d; border: 1px solid rgba(251, 191, 36, 0.25); }

    .search-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      width: 230px;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    button {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    /* Lyrics Area */
    .lyrics-wrapper {
      position: relative;
      flex: 1;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .lyrics-container {
      height: 100%;
      overflow-y: auto;
      padding: 38vh 10vw;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .lyrics-container::-webkit-scrollbar {
      display: none;
    }

    .lyric-line {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 26px;
      letter-spacing: -0.02em;
      transform: scale(0.95);
      transform-origin: left center;
      filter: blur(1.8px);
      opacity: 0.4;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.4s ease,
                  opacity 0.4s ease,
                  color 0.3s ease;
      cursor: pointer;
    }

    .lyrics-container:hover .lyric-line {
      filter: blur(0px);
      opacity: 0.7;
    }

    .lyric-line.active {
      transform: scale(1.03);
      filter: blur(0px) !important;
      opacity: 1 !important;
    }

    /* MODE 1: LRC LOKAL (Gradasi tipis kiri->kanan + Huruf naik 1px/1dp) */
    .lyric-word {
      display: inline-block;
      white-space: pre-wrap;
    }

    .lyric-char {
      display: inline-block;
      white-space: pre;
      background-image: linear-gradient(
        90deg,
        #ffffff calc(var(--char-prog, 0%) - 2%),
        rgba(255, 255, 255, 0.32) calc(var(--char-prog, 0%) + 2%)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transform: translateY(calc(var(--char-lift, 0) * -1px));
      transition: transform 0.14s ease-out;
      will-change: transform, background-image;
    }

    .lyric-line:not(.active) .lyric-char {
      background-image: none;
      color: rgba(255, 255, 255, 0.45);
      transform: translateY(0px);
    }

    /* MODE 2: LRCLIB FALLBACK (Tanpa Animasi Per Kata/Huruf) */
    .lyric-line.plain-sync {
      color: rgba(255, 255, 255, 0.45);
    }
    .lyric-line.plain-sync.active {
      color: #ffffff;
    }

    /* Indikator Jeda Musik */
    .lyric-line.interlude {
      display: flex;
      gap: 8px;
      align-items: center;
      height: 36px;
    }

    .interlude-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
    }

    .lyric-line.active .interlude-dot {
      background: #ffffff;
      animation: pulseDot 1.4s infinite ease-in-out;
    }
    .lyric-line.active .interlude-dot:nth-child(2) { animation-delay: 0.2s; }
    .lyric-line.active .interlude-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulseDot {
      0%, 100% { transform: scale(0.8); opacity: 0.4; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    /* Custom Player Controls Bawah */
    .player-bar {
      padding: 14px 24px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }

    .play-toggle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .time-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      font-variant-numeric: tabular-nums;
      min-width: 38px;
    }

    .seek-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .status-msg {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 16px;
      margin-top: 10vh;
    }
  </style>
</head>
<body>

  <!-- Mini Player YouTube (Harus terlihat & min 200x113px agar diizinkan YouTube) -->
  <div class="yt-mini-box">
    <div id="yt-hidden-player"></div>
  </div>

  <div class="top-bar">
    <div class="track-info-wrap">
      <img id="cover-art" class="cover-art" alt="Cover" />
      <div class="song-meta">
        <h1 id="track-title">Cari Lagu untuk Memutar <span id="source-badge"></span></h1>
        <p id="track-artist">MusicVault Backend + Local Enhanced LRC / LRCLIB</p>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Ketik judul lagu..." />
      <button id="search-btn">Putar</button>
    </div>
  </div>

  <div class="lyrics-wrapper">
    <div class="lyrics-container" id="lyrics-container">
      <div class="status-msg">Ketik nama lagu di atas untuk mencari & memutar musik.</div>
    </div>
  </div>

  <div class="player-bar">
    <button class="play-toggle" id="play-pause-btn" title="Play / Pause">▶</button>
    <span class="time-label" id="curr-time">0:00</span>
    <input type="range" class="seek-bar" id="seek-bar" min="0" max="100" value="0" step="0.1" />
    <span class="time-label" id="dur-time">0:00</span>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const API_BASE = 'https://musicvalt-api.revhan-stories12.workers.dev/?q=';
    const container = document.getElementById('lyrics-container');
    const titleEl = document.getElementById('track-title');
    const artistEl = document.getElementById('track-artist');
    const coverEl = document.getElementById('cover-art');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const seekBar = document.getElementById('seek-bar');
    const currTimeEl = document.getElementById('curr-time');
    const durTimeEl = document.getElementById('dur-time');

    let ytPlayer = null;
    let isPlayerReady = false;
    let pendingVideoId = null;
    let isSeeking = false;

    let lineElements = [];
    let activeLineIndex = -1;
    let isAnimatedMode = false;
    let isUserScrolling = false;
    let scrollTimeout = null;

    // 1. INISIALISASI YOUTUBE IFRAME PLAYER
    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('yt-hidden-player', {
        height: '124',
        width: '220',
        playerVars: {
          autoplay: 1,
          controls: 1,
          playsinline: 1,
          rel: 0,
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            isPlayerReady = true;
            if (pendingVideoId) {
              ytPlayer.loadVideoById(pendingVideoId);
              pendingVideoId = null;
            }
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              playPauseBtn.textContent = '⏸';
            } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
              playPauseBtn.textContent = '▶';
            }
          },
          onError: (e) => {
            // Kode 101 / 150 artinya pemilik lagu memblokir pemutaran embed di luar YouTube
            if (e.data === 101 || e.data === 150) {
              artistEl.textContent = '⚠️ Lagu ini diblokir embed oleh YouTube. Coba lagu lain atau versi video/lirik.';
            } else {
              artistEl.textContent = `⚠️ YouTube Player Error (${e.data})`;
            }
          }
        }
      });
    };

    function playYouTubeId(videoId) {
      if (!videoId) return;
      if (isPlayerReady && ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
        ytPlayer.loadVideoById(videoId);
        ytPlayer.playVideo();
      } else {
        pendingVideoId = videoId;
      }
    }

    function getCurrentPlaybackTime() {
      if (isPlayerReady && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
        return ytPlayer.getCurrentTime() || 0;
      }
      return 0;
    }

    function getPlaybackDuration() {
      if (isPlayerReady && ytPlayer && typeof ytPlayer.getDuration === 'function') {
        return ytPlayer.getDuration() || 0;
      }
      return 0;
    }

    function seekToTime(sec) {
      if (isPlayerReady && ytPlayer && typeof ytPlayer.seekTo === 'function') {
        ytPlayer.seekTo(sec, true);
        ytPlayer.playVideo();
      }
    }

    playPauseBtn.addEventListener('click', () => {
      if (!isPlayerReady || !ytPlayer) return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    });

    seekBar.addEventListener('input', () => { isSeeking = true; });
    seekBar.addEventListener('change', () => {
      seekToTime(parseFloat(seekBar.value));
      isSeeking = false;
    });

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    ['wheel', 'touchmove'].forEach(evt => {
      container.addEventListener(evt, () => {
        isUserScrolling = true;
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => { isUserScrolling = false; }, 2500);
      }, { passive: true });
    });

    // 2. PARSER ENHANCED LRC LOKAL (<00:14.09>)
    function parseEnhancedLRC(lrcText) {
      const lines = lrcText.split(/\r?\n/);
      const result = [];
      const lineRegex = /^\[(\d{2}):(\d{2}\.\d{2,3})\](.*)$/;
      const wordRegex = /<(\d{2}):(\d{2}\.\d{2,3})>([^<]*)/g;
      const toSec = (m, s) => parseInt(m, 10) * 60 + parseFloat(s);

      for (const raw of lines) {
        const match = raw.trim().match(lineRegex);
        if (!match) continue;

        const lineStart = toSec(match[1], match[2]);
        const content = match[3];

        if (!content || content.trim() === '') {
          result.push({ lineStart, isInterlude: true, words: [] });
          continue;
        }

        const words = [];
        let wMatch;
        wordRegex.lastIndex = 0;

        while ((wMatch = wordRegex.exec(content)) !== null) {
          words.push({
            start: toSec(wMatch[1], wMatch[2]),
            text: wMatch[3]
          });
        }

        if (words.length > 0) {
          words[0].text = words[0].text.replace(/^\s+/, '');
          for (let i = 0; i < words.length; i++) {
            words[i].end = (i < words.length - 1) ? words[i + 1].start : words[i].start + 1.5;
          }
          result.push({ lineStart, isInterlude: false, words });
        } else {
          result.push({ lineStart, isInterlude: false, text: content.trim(), words: [] });
        }
      }

      for (let i = 0; i < result.length - 1; i++) {
        const nextStart = result[i + 1].lineStart;
        const wList = result[i].words;
        if (wList && wList.length > 0 && wList[wList.length - 1].end > nextStart) {
          wList[wList.length - 1].end = nextStart;
        }
      }

      return result;
    }

    // 3. PARSER LRC STANDAR LRCLIB
    function parsePlainLRC(lrcText) {
      const lines = lrcText.split(/\r?\n/);
      const result = [];
      const lineRegex = /^\[(\d{2}):(\d{2}\.\d{2,3})\](.*)$/;
      const toSec = (m, s) => parseInt(m, 10) * 60 + parseFloat(s);

      for (const raw of lines) {
        const match = raw.trim().match(lineRegex);
        if (!match) continue;
        const lineStart = toSec(match[1], match[2]);
        const text = match[3].trim();
        result.push({
          lineStart,
          isInterlude: text === '',
          text
        });
      }
      return result;
    }

    // 4. RENDER LIRIK
    function renderLyrics(data, animated) {
      container.innerHTML = '';
      activeLineIndex = -1;
      lineElements = [];
      isAnimatedMode = animated;

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="status-msg">Lirik tidak ditemukan.</div>';
        return;
      }

      data.forEach((line) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'lyric-line' +
          (line.isInterlude ? ' interlude' : '') +
          (!animated && !line.isInterlude ? ' plain-sync' : '');

        lineDiv.addEventListener('click', () => {
          seekToTime(line.lineStart);
        });

        const charRefs = [];

        if (line.isInterlude) {
          lineDiv.innerHTML = '<span class="interlude-dot"></span><span class="interlude-dot"></span><span class="interlude-dot"></span>';
        } else if (animated && line.words && line.words.length > 0) {
          line.words.forEach((w) => {
            const wordSpan = document.createElement('span');
            wordSpan.className = 'lyric-word';

            const chars = Array.from(w.text);
            const wordDur = Math.max(w.end - w.start, 0.05);
            const charDur = wordDur / Math.max(chars.length, 1);

            chars.forEach((ch, idx) => {
              const charSpan = document.createElement('span');
              charSpan.className = 'lyric-char';
              charSpan.textContent = ch;
              wordSpan.appendChild(charSpan);

              charRefs.push({
                el: charSpan,
                start: w.start + idx * charDur,
                end: w.start + (idx + 1) * charDur,
                isSpace: ch.trim() === ''
              });
            });

            lineDiv.appendChild(wordSpan);
          });
        } else {
          lineDiv.textContent = line.text || '';
        }

        container.appendChild(lineDiv);
        lineElements.push({ el: lineDiv, data: line, charRefs });
      });
    }

    // 5. LOOP SINKRONISASI 60FPS
    function syncLoop() {
      const now = getCurrentPlaybackTime();
      const dur = getPlaybackDuration();

      if (dur > 0 && !isSeeking) {
        seekBar.max = dur;
        seekBar.value = now;
        currTimeEl.textContent = formatTime(now);
        durTimeEl.textContent = formatTime(dur);
      }

      if (lineElements.length > 0) {
        let currentIdx = -1;
        for (let i = 0; i < lineElements.length; i++) {
          const start = lineElements[i].data.lineStart;
          const next = (i < lineElements.length - 1) ? lineElements[i + 1].data.lineStart : Infinity;
          if (now >= start && now < next) {
            currentIdx = i;
            break;
          }
        }

        if (currentIdx !== activeLineIndex) {
          if (activeLineIndex !== -1 && lineElements[activeLineIndex]) {
            lineElements[activeLineIndex].el.classList.remove('active');
          }
          if (currentIdx !== -1 && lineElements[currentIdx]) {
            const target = lineElements[currentIdx].el;
            target.classList.add('active');
            if (!isUserScrolling) {
              target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }
          activeLineIndex = currentIdx;
        }

        if (isAnimatedMode && activeLineIndex !== -1) {
          const activeLine = lineElements[activeLineIndex];
          activeLine.charRefs.forEach((c) => {
            let prog = 0;
            let lift = 0;

            if (now >= c.end) {
              prog = 100;
              lift = 0;
            } else if (now > c.start) {
              const cDur = Math.max(c.end - c.start, 0.02);
              prog = ((now - c.start) / cDur) * 100;
              lift = c.isSpace ? 0 : 1;
            }

            c.el.style.setProperty('--char-prog', `${prog.toFixed(1)}%`);
            c.el.style.setProperty('--char-lift', lift);
          });
        }
      }

      requestAnimationFrame(syncLoop);
    }

    syncLoop();

    function setHeader(title, artist, cover, badgeText, badgeClass) {
      titleEl.innerHTML = `${title} ${badgeText ? `<span class="badge ${badgeClass}">${badgeText}</span>` : ''}`;
      artistEl.textContent = artist || 'Unknown Artist';
      if (cover) {
        coverEl.src = cover;
        coverEl.style.display = 'block';
      } else {
        coverEl.style.display = 'none';
      }
    }

    // 6. MUAT LIRIK: Cek ./M-lyrics-api/lyrics/{id}.lrc -> ./lyrics/{id}.lrc -> Fallback LRCLIB
    async function loadLyricsWithFallback(videoId, title, artist, cover) {
      container.innerHTML = '<div class="status-msg">Memuat lirik...</div>';

      if (videoId) {
        const candidatePaths = [
          `./M-lyrics-api/lyrics/${videoId}.lrc`,
          `./lyrics/${videoId}.lrc`
        ];

        for (const path of candidatePaths) {
          try {
            const localRes = await fetch(path);
            if (localRes.ok) {
              const text = await localRes.text();
              if (!text.trim().startsWith('<!DOCTYPE') && !text.trim().startsWith('<html')) {
                const parsed = parseEnhancedLRC(text);
                const hasWordSync = parsed.some(l => l.words && l.words.length > 0);
                setHeader(title, artist, cover, 'LRC Lokal (Animated)', 'badge-local');
                renderLyrics(parsed, hasWordSync);
                return;
              }
            }
          } catch (_) {}
        }
      }

      try {
        const cleanTitle = title.replace(/\s*\(.*?\)\s*/g, ' ').trim();
        const query = artist ? `${cleanTitle} ${artist}` : cleanTitle;
        const lrcLibRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
        if (lrcLibRes.ok) {
          const list = await lrcLibRes.json();
          const match = list.find(item => item.syncedLyrics);
          if (match) {
            const parsedPlain = parsePlainLRC(match.syncedLyrics);
            setHeader(title, artist, cover, 'LRCLIB (Standard)', 'badge-lrclib');
            renderLyrics(parsedPlain, false);
            return;
          }
        }
      } catch (_) {}

      setHeader(title, artist, cover, '', '');
      container.innerHTML = '<div class="status-msg">Lirik belum tersedia di koleksi lokal maupun LRCLIB.</div>';
    }

    // 7. CARI & PUTAR DARI BACKEND API KAMU
    async function searchAndPlay() {
      const q = searchInput.value.trim();
      if (!q) return;

      container.innerHTML = '<div class="status-msg">Mencari lagu di MusicVault API...</div>';

      try {
        const res = await fetch(`${API_BASE}${encodeURIComponent(q)}`);
        const json = await res.json();

        const item = Array.isArray(json) ? json[0] : json;
        if (!item || !item.id) {
          container.innerHTML = '<div class="status-msg">Lagu tidak ditemukan.</div>';
          return;
        }

        const videoId = item.id;
        const title = item.judul || item.title || q;
        const artist = item.artis || item.artist || '';
        const cover = item.coverArt || '';

        playYouTubeId(videoId);
        await loadLyricsWithFallback(videoId, title, artist, cover);
      } catch (err) {
        container.innerHTML = '<div class="status-msg">Gagal terhubung ke backend API.</div>';
        console.error(err);
      }
    }

    searchBtn.addEventListener('click', searchAndPlay);
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchAndPlay();
    });
  </script>
</body>
</html>
